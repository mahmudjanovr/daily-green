name: DailyGreen CI & Verification Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Production Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js v22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Host Python 3.12 & Git CLI
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Static Type Analysis
        run: npm run lint

      - name: Execute Full Automated Test Suite (All 11 Suites)
        run: npm test

      - name: Execute Production Application Build
        run: npm run build

      - name: Verify Secret Hygiene & Clean Build
        run: |
          # Ensure no live tokens leaked into dist bundles
          if grep -Eq 'ghp_[a-zA-Z0-9]{30,}|AIzaSy[a-zA-Z0-9_-]{33}' dist/assets/*.js 2>/dev/null; then
            echo "::error::Credential leak detected in production bundle!"
            exit 1
          fi
          echo "Secret hygiene verified: Clean dist bundle."
