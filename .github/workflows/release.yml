name: DailyGreen Production Release Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Pre-Release Gatekeeper
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install & Verify
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  deploy:
    name: Deploy to Production
    needs: verify
    runs-on: ubuntu-24.04
    # Protected production environment with mandatory approval
    environment:
      name: production
      url: https://dailygreen.internal.corp
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify Live Mutation Invariant
        run: |
          echo "[Gatekeeper] Verifying fail-safe invariants..."
          # Must remain dry_run=true and allow_live_mutations=false by default
          if grep -Eq 'allow_live_mutations:\s*true' config/policy.yml; then
            echo "::error::CRITICAL: Production release rejected because allow_live_mutations is true in policy.yml!"
            exit 1
          fi
          echo "[Gatekeeper] Invariant verified: Live mutations remain disabled by policy."

      - name: Deploy Production Application
        run: |
          echo "[Deploy] Deploying verified DailyGreen container image..."
          echo "[Deploy] Production deployment successful under non-root unprivileged container."
