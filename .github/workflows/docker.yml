name: DailyGreen Docker Build & Container Healthcheck

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'package*.json'
      - 'server.ts'
      - 'src/**'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    name: Build Multi-Stage Container & Run Healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dailygreen:test
          load: true

      - name: Test Container Startup & Healthcheck
        run: |
          docker run -d --name dg-test -p 3000:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DRY_RUN=true \
            -e ALLOW_LIVE_MUTATIONS=false \
            -e MAX_WORKERS=1 \
            -e DAILYGREEN_ENABLED=false \
            dailygreen:test

          echo "Waiting for container startup..."
          sleep 5

          # Probe /api/health verifying HTTP 200 and status: ok
          HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" http://localhost:3000/api/health || echo "FAILED")
          HEALTH=$(cat /tmp/health.json 2>/dev/null || echo "FAILED")
          echo "HTTP status code: $HTTP_CODE"
          echo "Health response: $HEALTH"

          if [ "$HTTP_CODE" != "200" ] || [[ "$HEALTH" != *'"status":"ok"'* && "$HEALTH" != *'"status": "ok"'* ]]; then
            echo "::error::Container failed healthcheck! Expected HTTP 200 and JSON status: ok"
            docker logs dg-test
            exit 1
          fi

          echo "Container health check passed successfully."
          docker stop dg-test && docker rm dg-test
