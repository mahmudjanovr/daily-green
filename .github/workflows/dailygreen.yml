name: DailyGreen Maintenance Automation

on:
  schedule:
    # Asia/Tashkent is UTC+5 (no Daylight Saving Time)
    # Primary run: 22:15 Asia/Tashkent = 17:15 UTC
    - cron: '15 17 * * *'
    # Backup check: 22:35 Asia/Tashkent = 17:35 UTC
    - cron: '35 17 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Specific authorized repository (e.g. owner/repo) or leave empty for all'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Run in dry-run simulation mode (true = no remote mutations)'
        required: true
        type: boolean
        default: true
      backup:
        description: 'Force backup run logic (skips if primary run already succeeded today)'
        required: false
        type: boolean
        default: false

concurrency:
  group: dailygreen-execution
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    name: Evaluate & Verify Maintenance Task (Sandbox)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      has_task: ${{ steps.check_artifact.outputs.has_task }}
      dry_run: ${{ steps.mode.outputs.dry_run }}

    steps:
      - name: Checkout DailyGreen Harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Determine Run Mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_BACKUP: ${{ inputs.backup }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # If scheduled at 17:35 UTC (22:35 Tashkent), flag as backup run
          IS_BACKUP="false"
          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "35 17 * * *" ]; then
            IS_BACKUP="true"
          elif [ "$INPUT_BACKUP" = "true" ]; then
            IS_BACKUP="true"
          fi
          echo "is_backup=${IS_BACKUP}" >> "$GITHUB_OUTPUT"

          DRY_RUN="true"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "false" ]; then
            DRY_RUN="false"
          fi
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

      - name: Execute DailyGreen Worker (Isolated Sandbox - No Write Tokens)
        env:
          DAILYGREEN_ENABLED: ${{ vars.DAILYGREEN_ENABLED || 'true' }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          # Read-only GitHub token for issue discovery; zero write privileges in worker
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REPO: ${{ inputs.repo }}
          IS_BACKUP: ${{ steps.mode.outputs.is_backup }}
        run: |
          ARGS=()
          if [ "$IS_BACKUP" = "true" ]; then
            ARGS+=(--backup)
          fi

          if [ -n "$INPUT_REPO" ]; then
            # Validate repository input format (must be owner/repo matching safe characters)
            if echo "$INPUT_REPO" | grep -Eq '^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$'; then
              ARGS+=(--repo "$INPUT_REPO")
            else
              echo "::error::Invalid repository input format '$INPUT_REPO'. Expected 'owner/repo'."
              exit 1
            fi
          fi

          ARGS+=(--worker-only)

          python -m dailygreen.cli run "${ARGS[@]}"

      - name: Check Sealed Artifact
        id: check_artifact
        run: |
          if [ -f ".dailygreen/sealed_task.json" ]; then
            echo "has_task=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_task=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Sealed Task Artifact
        if: steps.check_artifact.outputs.has_task == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dailygreen-sealed-artifact
          path: .dailygreen/sealed_task.json
          retention-days: 7

  delivery:
    name: Deliver Sealed Pull Request (Trusted Delivery)
    needs: worker
    if: needs.worker.outputs.has_task == 'true' && needs.worker.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout DailyGreen Harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Download Sealed Task Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dailygreen-sealed-artifact
          path: .dailygreen/

      - name: Deliver Verified PR (No Untrusted Repository Code Executed)
        env:
          DAILYGREEN_ENABLED: ${{ vars.DAILYGREEN_ENABLED || 'true' }}
          ALLOW_LIVE_MUTATIONS: ${{ vars.ALLOW_LIVE_MUTATIONS || 'false' }}
          DRY_RUN: ${{ needs.worker.outputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m dailygreen.cli deliver --sealed-artifact .dailygreen/sealed_task.json
