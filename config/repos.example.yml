
repositories:
  # Example 1: Astro / TypeScript project
  - name: "example-org/astro-portfolio"
    default_branch: "main"
    enabled: true
    max_diff_lines: 100
    timeout_seconds: 300
    allowed_paths:
      - "docs/**"
      - "README.md"
      - "src/content/blog/**"
    denied_paths:
      - "package.json"
      - "astro.config.mjs"
    supported_task_types:
      - "doc_links"
      - "doc_formatting"
      - "doc_typos"
      - "curated_backlog"
      - "issue_task"
    allow_ai_tasks: false
    baseline_command:
      - "npm"
      - "run"
      - "build"
    test_commands:
      - ["npm", "run", "build"]
    lint_commands:
      - ["npm", "run", "lint"]
    curated_tasks:
      - id: "astro-readme-links"
        title: "Verify and fix relative docs links in Astro documentation"
        description: "Check for broken relative Markdown links in docs/ and README.md"
        rationale: "Ensures documentation navigation works smoothly for visitors"
        acceptance_criteria:
          - "All relative links point to existing markdown files"
        risk_level: "low"
        validation_strategy: "deterministic_markdown_link_check"
        source: "backlog"
        target_files:
          - "README.md"

  # Example 2: Python / FastAPI project
  - name: "example-org/fastapi-service"
    default_branch: "main"
    enabled: true
    max_diff_lines: 120
    timeout_seconds: 300
    allowed_paths:
      - "docs/**"
      - "README.md"
      - "*.md"
    denied_paths:
      - "pyproject.toml"
      - "setup.py"
    supported_task_types:
      - "doc_links"
      - "doc_formatting"
      - "doc_typos"
      - "curated_backlog"
      - "issue_task"
    allow_ai_tasks: false
    baseline_command:
      - "pytest"
      - "-q"
    test_commands:
      - ["pytest", "-q"]
    lint_commands:
      - ["flake8", "docs/"]
    curated_tasks:
      - id: "fastapi-doc-formatting"
        title: "Clean up trailing whitespace and ensure newline at EOF in docs"
        description: "Deterministic cleanup of trailing whitespace and missing newlines in documentation"
        rationale: "Keeps documentation clean according to markdown style guidelines"
        acceptance_criteria:
          - "No trailing whitespace at end of lines"
          - "Files terminate with single newline"
        risk_level: "low"
        validation_strategy: "deterministic_format_check"
        source: "backlog"
        target_files:
          - "README.md"
          - "docs/index.md"
